PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_LABEL="Administrationsgruppen"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_DESC="Jeder Benutzer, der mindestens einer dieser Benutzergruppen angehört, darf sich als ein anderer Benutzer anmelden."

PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_LABEL="Erlaubte Anmeldegruppen"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_DESC="Benutzer, die mindestens einer dieser Benutzergruppen angehören, können von Mitgliedern der Administrationsgruppen als Zielbenutzer für eine Anmeldung verwendet werden."

PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_LABEL="Nicht erlaubte Anmeldegruppen"
PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_DESC="Benutzer, die mindestens einer dieser Benutzergruppen angehören, können nicht von Mitgliedern der Administrationsgruppen als Zielbenutzer verwendet werden. Wenn ein Benutzer sowohl einer erlaubten <em>als auch</em> einer nicht erlaubten Gruppe angehört, hat die nicht erlaubte Gruppe Vorrang."

PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_LABEL="Cookie-Lebensdauer (Sekunden)"
PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_DESC="Wie lange das Skeleton Key Cookie gültig ist. Halten Sie diesen Wert niedrig, um Sicherheitsprobleme zu vermeiden. Standard: 10 Sekunden."

PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_LABEL="Schlüssellänge"
PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_DESC="Die Länge (in Zeichen) des zufällig generierten Tokens für die Skeleton Key-Anmeldung. Je länger, desto besser für die Sicherheit. Standard: 32."

PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_LABEL="Multi-Faktor-Authentifizierung umgehen"
PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_DESC="Sicherheitseinstellung. Wenn aktiviert, wird eine von Skeleton Key erstellte Sitzung als bereits durch die Multi-Faktor-Authentifizierung (MFA) bestätigt markiert. Dadurch verhindert Joomla, dass Sie zur MFA-Anmeldeseite oder zur Seite „MFA einrichten“ weitergeleitet werden, wenn der Zielbenutzer einer Gruppe mit verpflichtender MFA angehört, aber noch keine MFA-Methode eingerichtet hat. Dies betrifft nur die imitierte Sitzung: Die eigenen MFA-Einstellungen des Zielbenutzers werden nicht geändert, und dessen normale Anmeldungen erfordern weiterhin MFA. Aktivieren Sie diese Option nur, wenn die Anmeldung als anderer Benutzer durch eine MFA-Seite blockiert wird. Standard: Nein."

PLG_SYSTEM_SKELETONKEY_LBL_NOAUTHPLUGIN="Bitte veröffentlichen Sie das Plugin „Authentication - Skeleton Key“, um sich als ein anderer Benutzer im Frontend anzumelden."
PLG_SYSTEM_SKELETONKEY_BTN_LABEL="Als Benutzer anmelden"
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED_AJAX="Anmeldung fehlgeschlagen: Der AJAX-Vorgang zum Setzen des Skeleton Key Cookies konnte nicht durchgeführt werden."
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED="Anmeldung fehlgeschlagen: Es konnte kein Skeleton Key Cookie für den angeforderten Benutzer erstellt werden."
PLG_SYSTEM_SKELETONKEY_ERR_BLOCKED="Dieser Benutzer ist gesperrt, daher ist eine Anmeldung als dieser Benutzer nicht möglich. Entsperren Sie den Benutzer zuerst."
PLG_SYSTEM_SKELETONKEY_ERR_MUSTRESET="Dieser Benutzer muss sein Passwort zurücksetzen, bevor er sich anmelden kann; daher ist eine Anmeldung als dieser Benutzer nicht möglich."
