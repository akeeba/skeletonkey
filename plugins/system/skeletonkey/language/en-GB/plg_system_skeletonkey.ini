PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_LABEL="Admin Groups"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_DESC="Any user who belongs to at least one of these user groups will be allowed to log in as another user."

PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_LABEL="Allowed Login Groups"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_DESC="Users who belong to at least one of these user groups will be available to be logged in by Admin Groups users."

PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_LABEL="Disallowed Login Groups"
PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_DESC="Users who belong to at least one of these user groups will not be available to be logged in by Admin Groups users. If a user belongs to both an allowed <em>and</em> a disallowed user group, the disallowed group wins, i.e. the user will not be available to be logged in."

PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_LABEL="Cookie Lifetime (seconds)"
PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_DESC="How long the Skeleton Key cookie will be valid for. Keep it low to prevent security issues. Default: 10 seconds."

PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_LABEL="Key Length"
PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_DESC="The length (in characters) of the random token generated for the Skeleton Key log-in. The longer the better for security. Default: 32."

PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_LABEL="Bypass Multi-factor Authentication"
PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_DESC="Security setting. When enabled, a session created by Skeleton Key is marked as having already passed Multi-factor Authentication (MFA). This prevents Joomla from redirecting you to the MFA captive login page, or to the 'set up MFA' page, when the target user belongs to a group with mandatory MFA but has not configured an MFA method yet. This only affects the impersonated session: the target user's own MFA settings are not changed, and their normal logins still require MFA. Only enable this if logging in as another user is being blocked by an MFA page. Default: No."

PLG_SYSTEM_SKELETONKEY_LBL_NOAUTHPLUGIN="Please publish the \"Authentication - Skeleton Key\" plugin to be able to log in to the frontend as a different user."
PLG_SYSTEM_SKELETONKEY_BTN_LABEL="Log in as user"
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED_AJAX="Log-in failed: cannot perform the AJAX operation required for setting the Skeleton Key cookie."
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED="Log-in failed: cannot create a Skeleton Key cookie for the requested user."
