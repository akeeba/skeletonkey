PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_LABEL="Beheergroepen"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_DESC="Alleen gebruikers in minstens één van deze gebruikersgroepen kunnen inloggen als een andere gebruiker."
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_LABEL="Toegestane inloggroepen"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_DESC="Het inloggen kan alleen voor gebruikers die in minstens één van deze gebruikersgroepen zijn opgenomen."
PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_LABEL="Niet toegestane inloggroepen"
PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_DESC="Het inloggen kan NIET voor gebruikers die in minstens één van deze groepen zijn opgenomen. De groepen die hier worden ingesteld overschrijven de toegestane inloggroepen."
PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_LABEL="Cookie geldigheid (seconden)"
PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_DESC="Hoe lang de Skeleton Key-cookie geldig moet zijn. Houd het laag om beveiligingsproblemen te voorkomen. Standaard: 10 seconden."
PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_LABEL="Sleutellengte"
PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_DESC="De lengte (in karakters) van de gegenereerde willekeurige token voor de Skeleton Key inlog. Hoe langer, hoe beter voor de beveiliging. Standaard: 32."
PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_LABEL="Multi-factor authenticatie omzeilen"
PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_DESC="Beveiligingsinstelling. Indien ingeschakeld, wordt een door Skeleton Key aangemaakte sessie gemarkeerd alsof deze al door multi-factor authenticatie (MFA) is gekomen. Dit voorkomt dat Joomla u doorstuurt naar de verplichte MFA-inlogpagina, of naar de pagina 'MFA instellen', wanneer de doelgebruiker behoort tot een groep met verplichte MFA maar nog geen MFA-methode heeft ingesteld. Dit heeft alleen invloed op de geïmpersoneerde sessie: de eigen MFA-instellingen van de doelgebruiker worden niet gewijzigd, en diens normale aanmeldingen vereisen nog steeds MFA. Schakel deze optie alleen in als het inloggen als een andere gebruiker wordt geblokkeerd door een MFA-pagina. Standaard: Nee."
PLG_SYSTEM_SKELETONKEY_LBL_NOAUTHPLUGIN="Publiceer de 'Authenticatie - Skeleton Key'-plugin om in te kunnen loggen op de frontend als een andere gebruiker."
PLG_SYSTEM_SKELETONKEY_BTN_LABEL="Login"
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED_AJAX="Inloggen mislukt: Kan de vereiste AJAX-bewerking niet uitvoeren voor het instellen van de Skeleton Key-cookie."
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED="Inloggen mislukt: Kan geen Skeleton Key-cookie maken voor de aangevraagde gebruiker."
PLG_SYSTEM_SKELETONKEY_ERR_BLOCKED="Deze gebruiker is geblokkeerd, dus het is niet mogelijk om als deze gebruiker in te loggen. Deblokkeer de gebruiker eerst."
PLG_SYSTEM_SKELETONKEY_ERR_MUSTRESET="Deze gebruiker moet zijn wachtwoord opnieuw instellen voordat hij kan inloggen, dus het is niet mogelijk om als deze gebruiker in te loggen."
