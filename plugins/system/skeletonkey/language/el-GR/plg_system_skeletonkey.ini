PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_LABEL="Ομάδες Διαχειριστών"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDCONTROLGROUPS_DESC="Όποιος χρήστης ανήκει σε τουλάχιστον μια από αυτές τις Ομάδες Χρηστών θα έχει την δυνατότητα να κάνει είσοδο ως άλλος χρήστης."

PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_LABEL="Επιτρεπόμενες Ομάδες Εισόδου"
PLG_SYSTEM_SKELETONKEY_CONFIG_ALLOWEDTARGETGROUPS_DESC="Οι χρήστες στις Ομάδες Διαχειριστών θα μπορούν να κάνουν είσοδο ως άλλος χρήστης μόνον εάν αυτός ο χρήστης ανήκει σε τουλάχιστον μια από τις Ομάδες Χρηστών που επιλέγετε σε αυτή την ρύθμιση."

PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_LABEL="Μη Επιτρεπόμενες Ομάδες Εισόδου"
PLG_SYSTEM_SKELETONKEY_CONFIG_DISALLOWEDTARGETGROUPS_DESC="Οι χρήστες στις Ομάδες Διαχειριστών <em>δεν</em> θα μπορούν να κάνουν είσοδο ως άλλος χρήστης εάν αυτός ο χρήστης ανήκει σε τουλάχιστον μια από τις Ομάδες Χρηστών που επιλέγετε σε αυτή την ρύθμιση."

PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_LABEL="Χρόνος Ζωής Cookie (δευτερόλεπτα)"
PLG_SYSTEM_SKELETONKEY_CONFIG_COOKIE_LIFETIME_DESC="Το χρονικό διάστημα κατά το οποίο το cookie του Skeleton Key θα είναι έγκυρο. Κρατήστε την τιμή χαμηλά για να αποφύγετε θέματα ασφαλείας. Εξορισμού τιμή: 10 δευτερόλεπτα"

PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_LABEL="Μήκος Κλειδιού"
PLG_SYSTEM_SKELETONKEY_CONFIG_KEY_LENGTH_DESC="Το μήκος (σε χαρακτήρες) του μυστικού κλειδιού που παράγεται τυχαία από το Skeleton Key για να πραγματοποιήσει είσοδο. Όσο μεγαλύτερο, τόσο καλύτερο για την ασφάλειά σας. Εξορισμού τιμή: 32"

PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_LABEL="Παράκαμψη Πολυπαραγοντικής Ταυτοποίησης"
PLG_SYSTEM_SKELETONKEY_CONFIG_BYPASS_MFA_DESC="Ρύθμιση ασφαλείας. Όταν είναι ενεργοποιημένη, μια συνεδρία που δημιουργείται από το Skeleton Key επισημαίνεται ως έχουσα ήδη περάσει την Πολυπαραγοντική Ταυτοποίηση (MFA). Αυτό αποτρέπει την ανακατεύθυνσή σας από την Joomla στη σελίδα υποχρεωτικής εισόδου MFA, ή στη σελίδα «ρύθμιση MFA», όταν ο χρήστης-στόχος ανήκει σε ομάδα με υποχρεωτική MFA αλλά δεν έχει ακόμη ρυθμίσει κάποια μέθοδο MFA. Αυτό επηρεάζει μόνο τη συνεδρία υποδυόμενου χρήστη: οι ρυθμίσεις MFA του ίδιου του χρήστη-στόχου δεν αλλάζουν, και οι κανονικές του συνδέσεις εξακολουθούν να απαιτούν MFA. Ενεργοποιήστε αυτή την επιλογή μόνο αν η είσοδος ως άλλος χρήστης εμποδίζεται από σελίδα MFA. Προεπιλογή: Όχι."

PLG_SYSTEM_SKELETONKEY_LBL_NOAUTHPLUGIN="Παρακαλώ δημοσιεύστε το πρόσθετο «Authentication - Skeleton Key» για να κάνετε είσοδο στο δημόσιο τμήμα του ιστοχώρου ως άλλος χρήστης."
PLG_SYSTEM_SKELETONKEY_BTN_LABEL="Είσοδος ως Χρήστης"
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED_AJAX="Αποτυχία εισόδου: δεν είναι δυνατή η εκτέλεση της διεργασίας AJAX που απαιτείται για την δημιουργία του cookie του Skeleton Key."
PLG_SYSTEM_SKELETONKEY_ERR_LOGINFAILED="Αποτυχία εισόδου: δεν είναι δυνατή η δημιουργία του cookie του Skeleton Key για τον επιλεγμένο χρήστη."
PLG_SYSTEM_SKELETONKEY_ERR_BLOCKED="Ο χρήστης αυτός είναι αποκλεισμένος, επομένως δεν είναι δυνατή η είσοδος ως αυτός. Καταργήστε πρώτα τον αποκλεισμό του χρήστη."
PLG_SYSTEM_SKELETONKEY_ERR_MUSTRESET="Ο χρήστης αυτός πρέπει να επαναφέρει τον κωδικό πρόσβασής του για να μπορεί να κάνει είσοδο, επομένως δεν είναι δυνατή η είσοδος ως αυτός."
