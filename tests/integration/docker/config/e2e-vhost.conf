# Virtual host for the throwaway Joomla site under test.

ServerName localhost
DocumentRoot "/var/www/html"

DirectoryIndex index.php index.html

<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Hand every PHP request to the php-fpm container over FastCGI. Both containers
# share the same /var/www/html bind mount, so SCRIPT_FILENAME resolves there.
<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# Lets a test make a request look like HTTPS to PHP (the stack itself only speaks HTTP), by sending
# `X-Forwarded-Proto: https`. That is how "Force HTTPS: Administrator only" is simulated: the back-end requests carry
# the header, the front-end ones do not.
SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on
